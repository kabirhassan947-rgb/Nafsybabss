<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Nafsybabs Admin</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#faf6f1;color:#150e1c;margin:0;padding:20px}
.w{max-width:820px;margin:auto}h1{font-family:Georgia,serif;font-weight:500}
.box{background:#fff;border:1px solid #e2d8cc;padding:20px;margin-bottom:18px}
label{display:block;font-size:.8rem;margin:10px 0 4px;color:#7b6f84}
input,select,textarea{width:100%;padding:10px;border:1px solid #d8cdbf;font:inherit}
button{background:#150e1c;color:#e8d08a;border:0;padding:11px 20px;cursor:pointer;font:inherit;margin-top:12px}
button.g{background:#c9a24b;color:#150e1c}button.r{background:#b3261e;color:#fff;padding:6px 12px;margin:0}
.tabs button{background:none;color:#7b6f84;border-bottom:2px solid transparent;margin:0 14px 0 0;padding:6px 0}.tabs button.on{color:#150e1c;border-color:#c9a24b}
.row{display:flex;gap:12px;align-items:center;border-top:1px solid #eee3d6;padding:10px 0;font-size:.9rem}
.row img,.ph{width:56px;height:56px;object-fit:cover;background:#3a1d52;color:#c9a24b;display:flex;align-items:center;justify-content:center}
.row>div{flex:1}small{color:#7b6f84}.err{color:#b3261e;font-size:.85rem;margin-top:8px}.hide{display:none}
</style></head><body><div class="w">
<h1>Nafsybabs Admin</h1>
<div id="login" class="box"><label>Admin email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password">
<button class="g" onclick="signin()">Sign in</button> <button onclick="create()">First time? Create admin account</button><div class="err" id="le"></div></div>
<div id="app" class="hide">
<div class="box tabs"><button class="on" id="t1" onclick="tab(1)">Products</button><button id="t2" onclick="tab(2)">Orders</button><button id="t3" onclick="tab(3)">Customers</button><button onclick="out()" style="float:right">Sign out</button></div>
<div id="p1">
<div class="box"><h3 id="ft">Add a product</h3>
<label>Name</label><input id="name"><label>Category</label><select id="cat"></select>
<label>Price (&#8358;)</label><input id="price" type="number" min="0"><label>Description</label><textarea id="desc" rows="2"></textarea>
<label>Photo</label><input type="file" id="img" accept="image/*"><label><input type="checkbox" id="sold" style="width:auto"> Sold out</label>
<button class="g" onclick="save()">Save product</button> <button onclick="reset()">Clear</button><div class="err" id="pe"></div></div>
<div class="box"><h3>Your products</h3><div id="list"></div></div></div>
<div id="p2" class="hide box"><h3>Latest orders</h3><div id="orders">Loading...</div></div>
<div id="p3" class="hide box"><h3>Registered customers</h3><div id="custs">Loading...</div></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,addDoc,deleteDoc,collection,getDocs,onSnapshot,query,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBHB_DcYl0vAdHJdc1JrD756YAch4UTuWc",authDomain:"nafsybabs.firebaseapp.com",projectId:"nafsybabs",storageBucket:"nafsybabs.firebasestorage.app",messagingSenderId:"734849162698",appId:"1:734849162698:web:9368d82747243320d80333"});
const auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CATS=["Ankara / Atamfa","Lace","Veils","Shoes","Bags","Materials","Abayas","Jalabiyya","Incense","Kitchen Utensils","Other"];
$("cat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
let items=[],editId=null,photo="",unsub=null;
const deny=e=>e&&e.code==="permission-denied"?"This account is not the admin. Check the email in your Firestore rules.":(e.message||"Error");
window.signin=async()=>{$("le").textContent="";try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}catch(e){$("le").textContent="Could not sign in: "+(e.code||e.message)}};
window.create=async()=>{$("le").textContent="";try{await createUserWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}catch(e){$("le").textContent="Could not create account: "+(e.code||e.message)}};
window.out=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$("login").classList.toggle("hide",!!u);$("app").classList.toggle("hide",!u);
 if(unsub){unsub();unsub=null}
 if(u){unsub=onSnapshot(query(collection(db,"products"),orderBy("createdAt","desc")),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>{$("pe").textContent=deny(e)})}});
window.tab=n=>{[1,2,3].forEach(i=>{$("p"+i).classList.toggle("hide",i!==n);$("t"+i).classList.toggle("on",i===n)});if(n===2)orders();if(n===3)custs()};
function draw(){$("list").innerHTML=items.length?items.map((p,i)=>`<div class="row">${p.image?`<img src="${esc(p.image)}">`:'<span class="ph">N</span>'}<div><b>${esc(p.name)}</b><br><small>${esc(p.category)} · ${p.price?"&#8358;"+Number(p.price).toLocaleString():"no price"}${p.soldOut?" · SOLD OUT":""}</small></div><button onclick="ed(${i})">Edit</button> <button class="r" onclick="del(${i})">Delete</button></div>`).join(""):"<small>No products yet. Add your first one above.</small>"}
$("img").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);photo=c.toDataURL("image/jpeg",.75)};im.src=r.result};r.readAsDataURL(f)};
window.save=async()=>{const name=$("name").value.trim();$("pe").textContent="";if(!name)return $("pe").textContent="Enter a name";
 const p={name,category:$("cat").value,price:+$("price").value||0,desc:$("desc").value.trim(),image:photo,soldOut:$("sold").checked};
 try{if(editId)await setDoc(doc(db,"products",editId),p,{merge:true});else await addDoc(collection(db,"products"),{...p,createdAt:serverTimestamp()});reset()}catch(e){$("pe").textContent=deny(e)}};
window.reset=()=>{editId=null;photo="";["name","price","desc","img"].forEach(i=>$(i).value="");$("sold").checked=false;$("ft").textContent="Add a product"};
window.ed=i=>{const p=items[i];editId=p.id;photo=p.image||"";$("name").value=p.name;$("cat").value=p.category;$("price").value=p.price;$("desc").value=p.desc;$("sold").checked=!!p.soldOut;$("ft").textContent="Edit product";scrollTo(0,0)};
window.del=async i=>{if(confirm("Delete this product?")){try{await deleteDoc(doc(db,"products",items[i].id))}catch(e){$("pe").textContent=deny(e)}}};
async function orders(){try{const s=await getDocs(query(collection(db,"orders"),orderBy("createdAt","desc"),limit(50)));
 $("orders").innerHTML=s.size?s.docs.map(d=>{const o=d.data(),t=o.createdAt?o.createdAt.toDate().toLocaleString():"";return `<div class="row"><div><b>${esc(o.name)}</b> · ${esc(o.phone)}<br><small>${esc(o.email)} · ${esc(o.address)}</small><br>${(o.items||[]).map(c=>esc(c.name)+" x"+c.qty).join(", ")}<br><small>&#8358;${Number(o.total||0).toLocaleString()} · ${esc(o.via)} ${esc(o.ref)} · ${t}</small></div></div>`}).join(""):"<small>No orders yet.</small>"}catch(e){$("orders").textContent=deny(e)}}
async function custs(){try{const s=await getDocs(collection(db,"users"));
 $("custs").innerHTML=s.size?s.docs.map(d=>{const u=d.data();return `<div class="row"><div><b>${esc(u.name)}</b> · ${esc(u.phone)}<br><small>${esc(u.email)} · ${(u.cart||[]).length} item(s) in cart</small></div></div>`}).join(""):"<small>No customers yet.</small>"}catch(e){$("custs").textContent=deny(e)}}
</script></div></body></html>
